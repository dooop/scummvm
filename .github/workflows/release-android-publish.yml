name: "Reusable: publish Android AAR to Maven"

# Publishes an already built and verified Android bundle (release-android-build.yml)
# to GitHub Packages. Nothing native is rebuilt: Gradle repackages the exact .so files
# the verified AAR was built from, at the wrapper commit recorded in its provenance.
# The bundle comes either from the calling run's "android-release" artifact or, when
# release_tag is set, from that GitHub release's assets (release-engine-finalize.yml,
# which may run days after the artifact expired).

on:
  workflow_call:
    inputs:
      version:
        description: "Maven version to publish (for example 1.2.3)"
        required: true
        type: string
      release_tag:
        description: "Take the bundle from this GitHub release instead of the run artifact"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  NDK_VERSION: "29.0.14206865"
  SCUMMVM_ABIS: "arm64-v8a,x86_64"

jobs:
  publish:
    name: Publish io.github.dooop:scummvm:${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-android-publish-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Download bundle from run artifact
        if: inputs.release_tag == ''
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: ${{ runner.temp }}/android-release

      - name: Download bundle from release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'scummvm-android-*' \
            --dir "${RUNNER_TEMP}/android-release"

      - name: Read provenance
        id: provenance
        env:
          VERSION: ${{ inputs.version }}
        run: |
          file="${RUNNER_TEMP}/android-release/scummvm-android-provenance.txt"
          built="$(sed -n 's/^version=//p' "$file")"
          if [ "$built" != "$VERSION" ]; then
            echo "::error::Bundle was built for version '${built}', not '${VERSION}'"
            exit 1
          fi
          echo "wrapper_commit=$(sed -n 's/^wrapper_commit=//p' "$file")" >> "$GITHUB_OUTPUT"

      - name: Checkout the commit the bundle was built from
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.provenance.outputs.wrapper_commit }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unpack prebuilt native libraries
        run: |
          mkdir -p prebuilt-libs
          tar -xzf "${RUNNER_TEMP}/android-release/scummvm-android-prebuilt-libs.tar.gz" -C prebuilt-libs

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon :scummvm:publishReleasePublicationToGitHubPackagesRepository \
            -Pscummvm.abis="${SCUMMVM_ABIS}" \
            -Pscummvm.prebuiltLibsDir="${GITHUB_WORKSPACE}/prebuilt-libs" \
            -Pscummvm.version="${{ inputs.version }}" \
            -Pscummvm.githubRepository="${GITHUB_REPOSITORY}"

      - name: Collect published artifacts
        run: cp -R "${RUNNER_TEMP}/android-release" published-bundle

      - name: Upload published artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scummvm-android-${{ inputs.version }}
          path: |
            published-bundle/
            android/scummvm/build/publications/release/pom-default.xml
            android/scummvm/build/intermediates/source_jar/release/release-sources.jar
          if-no-files-found: error
