name: Release Android AAR (manual)

# Manual/out-of-band entry point for release-android-publish.yml. Normal Android
# releases happen automatically from release-engine-finalize.yml, with the
# version taken from the Swift package tag - use this only to republish Android
# on its own (e.g. after a failed or incorrect automatic release). Published
# versions are immutable, so pick a new version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version to publish (for example 1.2.3)"
        required: true
        type: string

jobs:
  publish:
    name: Publish
    uses: ./.github/workflows/release-android-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ inputs.version }}
