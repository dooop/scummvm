name: "Release engine: all platforms (Apple + Android)"

# The regular release: one manual run builds and verifies the Apple XCFrameworks and
# the Android AAR in parallel from the same commit. Only if both succeed does it
# create a draft GitHub release carrying both and open the "engine-bump/<tag>" PR.
# Merging that PR (release-engine-finalize.yml) creates the tag and publishes the
# release and the Maven package - nothing is public before then, so a failing
# platform never leaves a half-published version behind.
#
# Single-platform alternatives: release-apple.yml, release-android.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version for the release tag and Maven package (e.g. 0.8.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/release-validate.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.tag }}
      github_release: true

  apple:
    name: Apple
    needs: validate
    uses: ./.github/workflows/release-apple-build.yml

  android:
    name: Android
    needs: validate
    uses: ./.github/workflows/release-android-build.yml
    with:
      version: ${{ inputs.tag }}

  draft:
    name: Draft release
    needs: [apple, android]
    uses: ./.github/workflows/release-draft.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      tag: ${{ inputs.tag }}
      include_android: true
