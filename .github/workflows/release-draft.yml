name: "Reusable: draft release and open bump PR"

# Uploads the calling run's verified artifacts to a DRAFT GitHub release and opens an
# "engine-bump/<tag>" PR pointing Package.swift at it. A draft reserves the tag name
# without creating the git tag; release-engine-finalize.yml publishes it (creating
# the tag) once the PR merges.
#
# release-provenance.txt records the commit everything was built from, so finalize can
# refuse to tag anything but that commit plus the Package.swift bump.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (for example 1.2.3)"
        required: true
        type: string
      include_android:
        description: "Also attach the run's android-release bundle, published to Maven on merge"
        required: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    name: Draft ${{ inputs.tag }} and open bump PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download XCFrameworks
        uses: actions/download-artifact@v8
        with:
          name: apple-xcframeworks
          path: dist

      - name: Download Android bundle
        if: inputs.include_android
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: android-release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          INCLUDE_ANDROID: ${{ inputs.include_android }}
        run: |
          UPSTREAM="$(git rev-parse HEAD:scummvm)"
          {
            echo "release=${TAG}"
            echo "source_commit=${GITHUB_SHA}"
            echo "upstream_commit=${UPSTREAM}"
            echo "android=${INCLUDE_ANDROID}"
          } > release-provenance.txt

          {
            if [ "$INCLUDE_ANDROID" = true ]; then
              echo "Prebuilt ScummVM engine for all platforms: Apple XCFrameworks and the Android AAR \`io.github.dooop:scummvm:${TAG}\`."
            else
              echo "Prebuilt ScummVM engine for Apple platforms (no Android release for this version)."
            fi
            echo
            echo "Upstream commit: [\`${UPSTREAM}\`](https://github.com/scummvm/scummvm/commit/${UPSTREAM})"
            echo
            echo "Apple slices: ios-arm64, ios-arm64-simulator, tvos-arm64, tvos-arm64-simulator, macos-arm64."
            echo "No x86_64 - simulator builds require an Apple Silicon host."
            echo
            echo '## Package.swift'
            echo
            echo '```swift'
            echo "let engineBinaryBaseURL = \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}\""
            while read -r module checksum; do
              case "$module" in
                ScummVMiOS)   echo "let engineChecksumiOS = \"${checksum}\"" ;;
                ScummVMtvOS)  echo "let engineChecksumtvOS = \"${checksum}\"" ;;
                ScummVMmacOS) echo "let engineChecksummacOS = \"${checksum}\"" ;;
              esac
            done < dist/checksums.txt
            echo '```'
            echo
            echo "This release is a draft until [the version-bump PR](../../pulls?q=is%3Apr+head%3Aengine-bump%2F${TAG}) merges - the tag is not created until then."
          } > release-notes.md

          assets=(
            dist/ScummVMiOS.xcframework.zip
            dist/ScummVMtvOS.xcframework.zip
            dist/ScummVMmacOS.xcframework.zip
            dist/SOURCES.txt
            release-provenance.txt
          )
          if [ "$INCLUDE_ANDROID" = true ]; then
            assets+=(android-release/scummvm-android-*)
          fi

          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${assets[@]}"

      - name: Open Package.swift bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          INCLUDE_ANDROID: ${{ inputs.include_android }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          IOS_SUM="$(awk '$1=="ScummVMiOS"{print $2}' dist/checksums.txt)"
          TVOS_SUM="$(awk '$1=="ScummVMtvOS"{print $2}' dist/checksums.txt)"
          MAC_SUM="$(awk '$1=="ScummVMmacOS"{print $2}' dist/checksums.txt)"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          sed -i \
            -e "s|^let engineBinaryBaseURL = .*|let engineBinaryBaseURL = \"${BASE_URL}\"|" \
            -e "s|^let engineChecksumiOS = .*|let engineChecksumiOS = \"${IOS_SUM}\"|" \
            -e "s|^let engineChecksumtvOS = .*|let engineChecksumtvOS = \"${TVOS_SUM}\"|" \
            -e "s|^let engineChecksummacOS = .*|let engineChecksummacOS = \"${MAC_SUM}\"|" \
            Package.swift
          git diff --exit-code --quiet Package.swift && { echo "::error::Package.swift did not change"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="engine-bump/${TAG}"
          git checkout -b "$BRANCH"
          git add Package.swift
          git commit -m "chore: point Package.swift at engine release ${TAG}"
          git push origin "$BRANCH"

          if [ "$INCLUDE_ANDROID" = true ]; then
            ANDROID_NOTE="and publishes the already verified \`io.github.dooop:scummvm:${TAG}\` Android AAR from the release assets"
          else
            ANDROID_NOTE="(Apple-only release: nothing is published to Maven)"
          fi
          PR_BODY="$(printf 'Automated bump from the release pipeline, built from `%s` (upstream `%s`).\n\nMerging this PR publishes the draft `%s` release, creating the tag at this PR'"'"'s head commit, %s - see release-engine-finalize.yml. Do not push further commits to this branch: finalize refuses to tag anything but the build commit plus this Package.swift change.' "$GITHUB_SHA" "$(git rev-parse HEAD:scummvm)" "$TAG" "$ANDROID_NOTE")"
          gh pr create \
            --title "chore: point Package.swift at engine release ${TAG}" \
            --body "$PR_BODY" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH"
