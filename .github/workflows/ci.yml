name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin to the macos-15 runner's *default* Xcode: non-default Xcode installs on
  # this image have been observed missing iOS/tvOS platform support, which
  # breaks "generic/platform=iOS|tvOS" destination resolution.
  XCODE_VERSION: "16.4"

jobs:
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Record submodule commit
        run: git -C Sources/ScummVMEngine rev-parse HEAD > .scummvmengine-sha

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-macos-v2-${{ hashFiles('Package.swift', 'Package.resolved', '.scummvmengine-sha', 'Sources/**', '!Sources/ScummVMEngine/**', 'Tests/**') }}

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Build (ScummVM library + ScummVMApp)
        run: swift build -v

      - name: Run tests
        run: swift test -v

  build-ios:
    name: Build (iOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Record submodule commit
        run: git -C Sources/ScummVMEngine rev-parse HEAD > .scummvmengine-sha

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-ios-v2-${{ hashFiles('Package.swift', 'Package.resolved', '.scummvmengine-sha', 'Sources/**', '!Sources/ScummVMEngine/**', 'Tests/**') }}

      - name: Build ScummVM for iOS
        run: |
          xcodebuild build \
            -scheme ScummVM \
            -destination "generic/platform=iOS" \
            -derivedDataPath .build/derivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  build-tvos:
    name: Build (tvOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Record submodule commit
        run: git -C Sources/ScummVMEngine rev-parse HEAD > .scummvmengine-sha

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-tvos-v2-${{ hashFiles('Package.swift', 'Package.resolved', '.scummvmengine-sha', 'Sources/**', '!Sources/ScummVMEngine/**', 'Tests/**') }}

      - name: Build ScummVM for tvOS
        run: |
          xcodebuild build \
            -scheme ScummVM \
            -destination "generic/platform=tvOS" \
            -derivedDataPath .build/derivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  build-android:
    name: Build (Android AAR)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Upstream's configure greps this out of dists/android/build.gradle and
      # aborts on any mismatch, so it has to be the exact revision.
      NDK_VERSION: "23.2.8568313"
      # A representative slice of engines: enough to exercise configure, the
      # NDK toolchain, JNI wiring and packaging without a two-hour full build.
      # Drop scummvm.configureArgs to build every stable engine.
      SCUMMVM_ABIS: "arm64-v8a"
      SCUMMVM_CONFIGURE_ARGS: "--disable-all-engines --enable-engine=scumm,sky,sword1,agi"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Record submodule commit
        run: git -C Sources/ScummVMEngine rev-parse HEAD > .scummvmengine-sha

      - name: Cache native engine build
        uses: actions/cache@v4
        with:
          path: android/scummvm/build/native
          key: android-native-v1-${{ env.SCUMMVM_ABIS }}-${{ hashFiles('.scummvmengine-sha') }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      # The build resolves the NDK from $ANDROID_HOME/ndk/<version>, with the
      # version read out of the submodule's dists/android/build.gradle.
      - name: Build AAR
        working-directory: android
        run: |
          ./gradlew --no-daemon :scummvm:assembleRelease \
            -Pscummvm.abis="${SCUMMVM_ABIS}" \
            -Pscummvm.configureArgs="${SCUMMVM_CONFIGURE_ARGS}"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-android-aar
          path: android/scummvm/build/outputs/aar/*.aar
          if-no-files-found: error
